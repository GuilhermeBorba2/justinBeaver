<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>JustinBeaver</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; -webkit-app-region: drag; }
  body {
    display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; padding: 28px 32px 0;
    color: #f3ede8; font: 14px system-ui, sans-serif;
    background: radial-gradient(circle at 78% 30%, #4a3a33 0, #2a2423 55%, #1d1918 100%);
    border: 1px solid #4b413d;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 56px; height: 56px; }
  .brand h1 { margin: 0; font-size: 30px; letter-spacing: 0.01em; }
  .brand small { color: #c9b8ad; font-size: 12px; }
  .art { position: absolute; right: -40px; top: 20px; width: 260px; height: 260px; border-radius: 50%; border: 2px solid rgb(255 255 255 / 0.07); }
  .art::after { content: ''; position: absolute; inset: 40px; border-radius: 50%; border: 2px dashed rgb(224 123 57 / 0.35); animation: spin 14s linear infinite; }
  .foot p { margin: 0 0 2px; }
  .foot .sub { color: #c9b8ad; font-size: 12px; margin-bottom: 14px; }
  .bar { height: 4px; margin: 0 -32px; background: #3a3230; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 35%; background: #e07b39; animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="art"></div>
  <div class="brand"><img src="icon.png" alt="" /><div><h1>JustinBeaver</h1><small>Universal Database Manager</small></div></div>
  <div class="foot">
    <p id="msg">Starting the server…</p>
    <p class="sub" id="sub">Loading drivers and workspace</p>
    <div class="bar"><i></i></div>
  </div>
  <script>
    if ((navigator.language || '').toLowerCase().startsWith('pt')) {
      document.getElementById('msg').textContent = 'Iniciando o servidor…'
      document.getElementById('sub').textContent = 'Carregando drivers e área de trabalho'
    }
  </script>
</body>
</html>
